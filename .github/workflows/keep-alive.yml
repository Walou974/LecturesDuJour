name: Render Keep Alive

on:
  schedule:
    # Déclenchement automatique toutes les 10 minutes
    - cron: '*/10 * * * *'
  # Permet de lancer manuellement la tâche depuis l'onglet Actions
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          curl -s -f -o /dev/null --max-time 10 https://lecturesdujour.onrender.com/
